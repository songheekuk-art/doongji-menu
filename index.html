<!-- ════════════════════════════════════════════════════
     둥지 런처 · 한 달 리뷰 제출 알림 배지
     doongji-menu 의 런처 index.html 에서
     </body> 바로 위에 이 블록을 통째로 붙여넣으십시오.
     ════════════════════════════════════════════════════ -->

<style>
  /* 카드 위에 얹는 빨간 알림 배지 */
  .rv-badge{
    position:absolute; top:-9px; right:-9px;
    min-width:24px; height:24px; padding:0 7px;
    display:none; align-items:center; justify-content:center;
    background:#e03131; color:#fff;
    font-size:12.5px; font-weight:800; line-height:1;
    border-radius:999px; border:2px solid #fff;
    box-shadow:0 2px 8px rgba(224,49,49,.4);
    z-index:5;
  }
  .rv-badge.on{ display:flex; animation:rvPop .35s ease; }
  @keyframes rvPop{ 0%{transform:scale(.4);opacity:0} 100%{transform:scale(1);opacity:1} }

  /* 상단 바 알림 요약 */
  .rv-bar{
    display:none; align-items:center; gap:10px; flex-wrap:wrap;
    max-width:960px; margin:18px auto 0; padding:12px 16px;
    background:#fff5f5; border:1px solid #ffc9c9; border-left:4px solid #e03131;
    border-radius:8px; color:#9b2c2c; font-size:14px;
  }
  .rv-bar.on{ display:flex; }
  .rv-bar b{ font-weight:800; }
  .rv-bar .rv-names{ color:#6d3030; font-size:13px; }
  .rv-bar a{
    margin-left:auto; background:#e03131; color:#fff; text-decoration:none;
    padding:7px 14px; border-radius:6px; font-size:13.5px; font-weight:700;
  }
</style>

<script>
(function(){
  /* ── 설정: 한 달 리뷰가 올라간 Supabase 프로젝트 ── */
  const RV_URL  = 'https://YOUR_PROJECT.supabase.co';  // review.html 의 SUPABASE_URL 과 동일하게
  const RV_ANON = 'YOUR_ANON_KEY';                     // review.html 의 SUPABASE_ANON 과 동일하게
  const RV_PAGE = 'review.html';                       // 한 달 리뷰 페이지 경로

  const BASE = String(RV_URL).trim()
    .replace(/\/+$/,'').replace(/\/(rest|auth)\/v1$/,'').replace(/\/+$/,'');

  function rpc(fn, body){
    return fetch(BASE + '/rest/v1/rpc/' + fn, {
      method:'POST',
      headers:{ 'apikey':RV_ANON, 'Authorization':'Bearer '+RV_ANON, 'Content-Type':'application/json' },
      body: JSON.stringify(body || {})
    }).then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));
  }

  /* 한 달 리뷰 카드를 찾아 배지를 붙인다 */
  function findCard(){
    const links = document.querySelectorAll('a[href*="' + RV_PAGE + '"]');
    if(links.length) return links[0];
    // href 로 못 찾으면 카드 제목으로 탐색
    const all = document.querySelectorAll('a, .card, [class*="card"]');
    for(const el of all){
      if((el.textContent || '').indexOf('한 달 리뷰') > -1) return el;
    }
    return null;
  }

  function fmt(ts){
    const d = new Date(ts);
    if(isNaN(d)) return '';
    return (d.getMonth()+1) + '/' + d.getDate();
  }

  function render(data){
    const n = data && data.count ? data.count : 0;
    if(!n) return;

    /* 1) 카드 배지 */
    const card = findCard();
    if(card){
      const host = card.closest('a') || card;
      const cs = getComputedStyle(host);
      if(cs.position === 'static') host.style.position = 'relative';
      let b = host.querySelector('.rv-badge');
      if(!b){
        b = document.createElement('span');
        b.className = 'rv-badge';
        host.appendChild(b);
      }
      b.textContent = n > 99 ? '99+' : n;
      b.classList.add('on');
    }

    /* 2) 상단 알림 바 */
    const names = (data.recent || []).map(r => r.building_name + '(' + fmt(r.submitted_at) + ')').join(' · ');
    const bar = document.createElement('div');
    bar.className = 'rv-bar on';
    bar.innerHTML =
      '<span>한 달 리뷰 설문에 <b>새 응답 ' + n + '건</b>이 도착했습니다.</span>'
      + (names ? '<span class="rv-names">' + names + '</span>' : '')
      + '<a href="' + RV_PAGE + '" id="rvGo">확인하기 →</a>';

    const main = document.querySelector('main') || document.body;
    const first = main.firstElementChild;
    if(first) main.insertBefore(bar, first); else main.appendChild(bar);

    /* 3) 확인하러 들어가면 읽음 처리 */
    function markRead(e){
      try{ rpc('review_mark_read'); }catch(err){}
    }
    const go = document.getElementById('rvGo');
    if(go) go.addEventListener('click', markRead);
    const cardLink = card && (card.closest('a') || card);
    if(cardLink) cardLink.addEventListener('click', markRead);
  }

  function check(){
    if(RV_URL.indexOf('YOUR_PROJECT') > -1) return;   // 설정 전에는 조용히 종료
    rpc('review_unread_summary').then(render).catch(function(){ /* 조용히 무시 */ });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', check);
  } else {
    check();
  }
  /* 탭을 열어둔 채로도 2분마다 갱신 */
  setInterval(check, 120000);
})();
</script>
